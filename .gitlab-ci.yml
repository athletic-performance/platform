# Validation pipeline для Merge Request и main.
# Сборка/публикация Docker image и staging deploy — отдельные foundation-задачи после initial commit.

workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  image: node:22-bookworm
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

variables:
  PNPM_HOME: /root/.local/share/pnpm
  PNPM_STORE_DIR: '$CI_PROJECT_DIR/.pnpm-store'

stages:
  - install
  - validate

.pnpm_setup: &pnpm_setup
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.14.0 --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"

install:
  stage: install
  <<: *pnpm_setup
  script:
    - pnpm install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
      - apps/*/node_modules/
      - packages/*/node_modules/
    expire_in: 1 hour

lint:
  stage: validate
  <<: *pnpm_setup
  needs: ['install']
  script:
    - pnpm lint

typecheck:
  stage: validate
  <<: *pnpm_setup
  needs: ['install']
  script:
    - pnpm typecheck

test:
  stage: validate
  <<: *pnpm_setup
  needs: ['install']
  script:
    - pnpm test

build:
  stage: validate
  <<: *pnpm_setup
  needs: ['install']
  script:
    - pnpm build

migrate:check:
  stage: validate
  <<: *pnpm_setup
  needs: ['install']
  # Тестовый несекретный URL только для prisma validate (БД в job не поднимается).
  variables:
    DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
  script:
    - pnpm --filter api prisma:validate
    - test -d apps/api/prisma/migrations
